# Baker Bridge — config for the shared bridge-lesson-packaging builder (package.sh).
# Input = Presentation/ (control tags stripped), output = Rotations/. Large auction lessons,
# sliced 4/5/6; the declarer's plan is emitted only for Declarer Play lessons (size fix).
#
# Every setting takes an environment override (`${VAR:-default}`) so a trial build can be
# pointed at a scratch tree — a plain assignment here silently wins over the environment,
# which makes `OUTPUT_DIR=/tmp/x package.sh --config baker.conf ...` overwrite the real
# Rotations/ instead.
INPUT_DIR="${INPUT_DIR:-Presentation}"
OUTPUT_DIR="${OUTPUT_DIR:-Rotations}"
SET_SIZES="${SET_SIZES:-4 5 6}"
ROTATE_PATTERNS="${ROTATE_PATTERNS:-S,NS,NESW}"
# Note the "-" (not ":-"): DECLARER_PLAN_CATEGORY="" means *every* lesson gets a plan, and
# that empty value must survive rather than falling back to this default.
DECLARER_PLAN_CATEGORY="${DECLARER_PLAN_CATEGORY-Declarer Play}"
LIN="${LIN:-0}"
